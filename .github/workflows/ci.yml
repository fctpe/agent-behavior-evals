name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The spec format is the contract with braintrustdata/agentbehavior. If a
      # committed spec stops parsing, that is a break worth failing on — and it
      # costs nothing, since validate makes no model calls.
      - name: Behavior specs still parse
        run: node dist/index.js validate .agents/behaviors
